# Fast quality gate. Runs on every PR touching Python sources.
name: Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "pyproject.toml"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tools/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        # Plain pip into the setup-python interpreter -- deliberately NOT uv:
        # uv's venv discovery/sync proved nondeterministic across runs (a
        # missing .venv or missing dev deps fails the gate in seconds with a
        # misleading error), while this exact pip sequence is what the green
        # Android workflow uses. Boring and deterministic beats clever here.
        run: |
          set -euo pipefail
          pip install --upgrade pip setuptools wheel
          pip install "flet==0.28.3" pyyaml coverage
          pip install -e extensions/flet_native_files
          pip install -e ".[dev]"
          pip list 2>/dev/null | grep -Ei "^(pytest|hypothesis|coverage|flet|pyyaml|cryptography) " || true

      - name: Package import smoke
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # Deps were pip-installed into this exact interpreter in the step
          # above -- plain `python`, no venv discovery of any kind.
          python - <<'PY'
          # Verify the app package and its view modules import without
          # launching UI (src/main.py itself runs ft.app() at import time, so
          # it is exercised by `flet build`, not by an import smoke).
          import importlib
          for mod in (
              "nano_offline",
              "nano_offline.app_context",
              "nano_offline.views.pos_view",
              "nano_offline.views.items_view",
              "nano_offline.views.finance_view",
              "nano_offline.views.invoice_view",
              "nano_offline.components.auth_layout",
              "nano_offline.components.command_bar",
          ):
              importlib.import_module(mod)
              print("OK", mod)
          from nano_offline.core.paths import database_path, app_data_dir
          print("db path helper:", database_path())
          print("data dir:", app_data_dir())
          PY

      - name: Quality gate script
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # Deps were just pip-installed into this interpreter above, so run
          # the gate with plain `python` -- no venv discovery, no silent
          # fallbacks. Probe each critical import separately and NON-fatally
          # (|| echo, never a bare call under set -e) so the log always shows
          # exactly which dependency is missing instead of dying cryptically.
          python -c "import sys; print(sys.version.replace(chr(10), ' '))"
          for mod in flet pytest hypothesis cryptography yaml coverage; do
            python -c "import $mod" 2>/dev/null && echo "dep ok: $mod" || echo "dep MISSING: $mod"
          done
          PYTHONPATH=src python tools/quality_gate.py
