# Build the Nano Windows desktop app (nanowin flavor) on every push/PR
# and on demand.
#
# Same shape as build-android-apk.yml: install deps, run the project's own
# quality gate (tools/quality_gate.py), resolve the version from
# src/nano_offline/version.py, then `flet build windows`. The exe and the
# full build log are kept as artifacts.
name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
      # Windows runner consoles default to cp1252, which cannot encode the
      # ▶/Arabic log lines tools/quality_gate.py and the smoke scripts print
      # (UnicodeEncodeError on the very first line). Force UTF-8 stdio for
      # every Python step instead of touching shared scripts for a
      # Windows-only console quirk.
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install project dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "flet==0.28.3" pyyaml coverage
          # The local extension first: flet-native-files is not on PyPI, so it
          # must already satisfy the pin before `pip install -e .[dev]` resolves.
          pip install -e extensions/flet_native_files
          pip install -e ".[dev]"

      - name: Run quality gate
        shell: pwsh
        run: |
          python tools/quality_gate.py

      - name: Show toolchain versions
        # Printed BEFORE the gate so a broken runner image is diagnosable
        # from this step alone instead of from a downstream cryptic failure.
        shell: pwsh
        run: |
          python --version
          pip list 2>$null | Select-String -Pattern "^(flet|pytest|hypothesis|coverage|pyyaml|cryptography)"
          flutter --version | Select-Object -First 3

      - name: Resolve app version from version.py
        # Single source of truth: the exe metadata is derived from the same
        # src/nano_offline/version.py the app shows on its splash/login screen.
        # Separate --version/--build calls with .Trim(): parsing one
        # multi-line --shell blob with regex keeps Windows CRLF tails
        # ("0.17.3\r") that silently corrupt the flet --build-version flag.
        id: appver
        shell: pwsh
        run: |
          $bv = (python tools/app_version.py --version).Trim()
          $bn = (python tools/app_version.py --build).Trim()
          if (-not $bv -or -not $bn) { throw "app_version.py returned empty version/build" }
          "build_version=$bv" >> $env:GITHUB_OUTPUT
          "build_number=$bn" >> $env:GITHUB_OUTPUT
          echo "Building Nano $bv (build $bn)"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          flet build windows --build-number "${{ steps.appver.outputs.build_number }}" --build-version "${{ steps.appver.outputs.build_version }}" --skip-flutter-doctor 2>&1 | Tee-Object -FilePath flet-build.log

      - name: Build Windows installer (Inno Setup)
        # The project ships as a real installer, not a portable exe: Inno
        # Setup bundles flet's Release folder (exe + flutter DLLs + data)
        # into Nano-Setup-<version>.exe. windows/installer.iss takes all
        # release values as /D defines so no version is ever hardcoded.
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $release = Get-ChildItem build/windows -Recurse -Directory -Filter Release | Select-Object -First 1
          if (-not $release) { throw "Release folder not found under build/windows" }
          $exe = Get-ChildItem $release.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No exe found in $($release.FullName)" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="${{ steps.appver.outputs.build_version }}" "/DExeName=$($exe.Name)" "/DSourceDir=$($release.FullName)" windows/installer.iss
          Get-ChildItem build/windows/installer/*.exe

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flet-build-log-windows
          path: flet-build.log

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-installer
          # Nano-Setup-<version>.exe produced by the Inno Setup step above --
          # if-no-files-found: error makes a missing installer fail the job
          # loudly instead of a hollow "success".
          path: |
            build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 14
