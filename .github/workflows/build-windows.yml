# Build the Nano Windows desktop app (nanowin flavor) on every push/PR
# and on demand.
#
# Same shape as build-android-apk.yml: install deps, run the project's own
# quality gate (tools/quality_gate.py), resolve the version from
# src/nano_offline/version.py, then `flet build windows`. The exe and the
# full build log are kept as artifacts.
name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
      # Windows runner consoles default to cp1252, which cannot encode the
      # ▶/Arabic log lines tools/quality_gate.py and the smoke scripts print
      # (UnicodeEncodeError on the very first line). Force UTF-8 stdio for
      # every Python step instead of touching shared scripts for a
      # Windows-only console quirk.
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip's HTTP wheel cache between runs (keyed on pyproject):
          # an unchanged dependency set resolves from cache instead of
          # re-downloading every wheel on every push.
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Flutter
        # Pin EXACTLY the Flutter flet-cli wants: flet 0.28.3 requires 3.29.x
        # and otherwise downloads its own 3.29.2 on top of whatever is on
        # PATH -- previously that meant TWO full SDK downloads per run
        # (1.8 GB of 3.47.7, then flet's own 3.29.2). With a matching SDK
        # already present flet skips its install, so enable windows-desktop
        # explicitly here (flet only runs that config on its own install
        # path).
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Enable Flutter Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install project dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "flet==0.28.3" pyyaml coverage
          # The local extension first: flet-native-files is not on PyPI, so it
          # must already satisfy the pin before `pip install -e .[dev]` resolves.
          pip install -e extensions/flet_native_files
          pip install -e ".[dev]"
          foreach ($m in @("flet", "pytest", "hypothesis", "cryptography", "yaml", "coverage")) {
            python -c "import $m" 2>$null
            if ($LASTEXITCODE -eq 0) { echo "dep ok: $m" } else { echo "dep MISSING: $m" }
          }

      - name: Exclude workspace and temp from Defender scan
        # The gate churns hundreds of fresh SQLite files (one temp DB per
        # integration test) and deletes them milliseconds later. Windows
        # Defender's real-time scan locks brand-new files in exactly that
        # window, so teardown fails with WinError 32 ("used by another
        # process") even though the app closed every handle -- the same
        # tree is green on Ubuntu. Excluding the workspace and TEMP is the
        # standard GH-runner fix and changes nothing about the product.
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP

      - name: Run quality gate
        # Gate output is teed to gate.log (uploaded below, always) and its
        # tail is echoed on failure, so a red build carries its own
        # diagnosis instead of requiring a full log download.
        shell: pwsh
        run: |
          python tools/quality_gate.py 2>&1 | Tee-Object -FilePath gate.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== gate.log tail (last 60 lines) ====="
            Get-Content gate.log -Tail 60
            exit 1
          }

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-log
          path: gate.log
          if-no-files-found: warn
          retention-days: 7

      - name: Show toolchain versions
        # Printed BEFORE the gate so a broken runner image is diagnosable
        # from this step alone instead of from a downstream cryptic failure.
        shell: pwsh
        run: |
          python --version
          pip list 2>$null | Select-String -Pattern "^(flet|pytest|hypothesis|coverage|pyyaml|cryptography)"
          flutter --version | Select-Object -First 3

      - name: Resolve app version from version.py
        # Single source of truth: the exe metadata is derived from the same
        # src/nano_offline/version.py the app shows on its splash/login screen.
        # Separate --version/--build calls with .Trim(): parsing one
        # multi-line --shell blob with regex keeps Windows CRLF tails
        # ("0.17.3\r") that silently corrupt the flet --build-version flag.
        id: appver
        shell: pwsh
        run: |
          $bv = (python tools/app_version.py --version).Trim()
          $bn = (python tools/app_version.py --build).Trim()
          if (-not $bv -or -not $bn) { throw "app_version.py returned empty version/build" }
          "build_version=$bv" >> $env:GITHUB_OUTPUT
          "build_number=$bn" >> $env:GITHUB_OUTPUT
          echo "Building Nano $bv (build $bn)"

      - name: Install Visual Studio 2019 Build Tools
        # flet 0.28.3 drives the windows build through Flutter 3.29, whose
        # CMake invocation pins the "Visual Studio 16 2019" generator -- a
        # newer VS alone does NOT satisfy it. The windows-2025-vs2026 runner
        # image ships no Visual Studio at all, so install the 2019 Build
        # Tools plus the C++ workload (MSVC v142 + Windows SDK) here, before
        # flet build needs them.
        shell: pwsh
        run: |
          choco install visualstudio2019buildtools visualstudio2019-workload-vctools -y --no-progress

      - name: Build Windows EXE
        # NOTE: the pipe to Tee-Object masks flet's exit code (the step would
        # stay green on a failed build and only blow up later at Inno Setup
        # with "Release folder not found"), so check $LASTEXITCODE explicitly
        # -- PowerShell preserves the native command's code across the pipe --
        # and dump the build log tail, mirroring the quality-gate step.
        shell: pwsh
        run: |
          flet build windows --build-number "${{ steps.appver.outputs.build_number }}" --build-version "${{ steps.appver.outputs.build_version }}" --skip-flutter-doctor 2>&1 | Tee-Object -FilePath flet-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== flet-build.log tail (last 80 lines) ====="
            Get-Content flet-build.log -Tail 80
            exit 1
          }

      - name: Diagnose bundle layout (TEMPORARY)
        # The installed app fails at launch with "No module named main": the
        # flet bootstrap runs runpy.run_module("main") against the extracted
        # app.zip, so either the zip lacks main.py at its root or the bundle
        # lacks the zip. CI logs aren't downloadable without admin rights, so
        # findings are exfiltrated as ::warning annotations (readable via the
        # Checks API) in addition to the printed log.
        # DELETE THIS STEP once the launch failure is understood.
        shell: pwsh
        run: |
          $top = (Get-ChildItem build/windows -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ';'
          Write-Host "::warning::TOP::$top"
          $zipPath = "build/windows/data/flutter_assets/app/app.zip"
          $hasZip = Test-Path $zipPath
          Write-Host "::warning::HASZIP::$hasZip"
          if (-not $hasZip) { throw "bundled app.zip missing at $zipPath" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipFull = Join-Path $PWD ($zipPath -replace '/', '\')
          $zip = [IO.Compression.ZipFile]::OpenRead($zipFull)
          $roots = @($zip.Entries.FullName | Where-Object { $_ -notmatch '/' } | Select-Object -First 30) -join ';'
          Write-Host "::warning::ZIPROOT::$roots"
          Write-Host "::warning::ZIPCOUNT::$($zip.Entries.Count)"
          $hasMain = [bool]($zip.Entries.FullName | Where-Object { $_ -eq 'main.py' -or $_ -eq 'main.pyc' })
          Write-Host "::warning::HASMAIN::$hasMain"
          $zip.Dispose()
          if (-not $hasMain) { throw "app.zip has no main.py/main.pyc at its root" }

      - name: Build Windows installer (Inno Setup)
        # The project ships as a real installer, not a portable exe: Inno
        # Setup bundles flet's output folder (exe + flutter DLLs + data)
        # into Nano-Setup-<version>.exe. NOTE on the layout: `flet build`
        # copies the flutter Release CONTENTS flat into build/windows/
        # (there is no nested Release/ folder -- that only exists inside
        # flet's intermediate build/flutter tree), so the exe is searched
        # directly in build/windows/.
        # windows/installer.iss takes all release values as /D defines so no
        # version is ever hardcoded.
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path build/windows)) {
            Write-Host "===== build/ tree ====="
            Get-ChildItem build -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw "no build/windows at all -- flet build produced nothing (see flet-build.log artifact)"
          }
          $exe = Get-ChildItem build/windows -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Host "===== build/windows tree ====="
            Get-ChildItem build/windows -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw "No exe found in build/windows"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # /O pins the output dir: a relative OutputDir inside the .iss is
          # resolved against the SCRIPT's folder (windows/...), not the repo
          # root, so without /O the installer lands in the wrong tree and the
          # upload step below finds nothing.
          & $iscc /DAppVersion="${{ steps.appver.outputs.build_version }}" "/DExeName=$($exe.Name)" "/DSourceDir=$($exe.DirectoryName)" /Obuild\windows\installer windows/installer.iss
          Get-ChildItem build/windows/installer/*.exe

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flet-build-log-windows
          path: flet-build.log

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-installer
          # Nano-Setup-<version>.exe produced by the Inno Setup step above --
          # if-no-files-found: error makes a missing installer fail the job
          # loudly instead of a hollow "success".
          path: |
            build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 14
