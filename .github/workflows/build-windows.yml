# Build the Nano Windows desktop app (nanowin flavor) on every push/PR
# and on demand.
#
# Same shape as build-android-apk.yml: install deps, run the project's own
# quality gate (tools/quality_gate.py), resolve the version from
# src/nano_offline/version.py, then `flet build windows`. The exe and the
# full build log are kept as artifacts.
name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install project dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "flet==0.28.3" pyyaml coverage
          # The local extension first: flet-native-files is not on PyPI, so it
          # must already satisfy the pin before `pip install -e .[dev]` resolves.
          pip install -e extensions/flet_native_files
          pip install -e ".[dev]"

      - name: Run quality gate
        shell: pwsh
        run: |
          python tools/quality_gate.py

      - name: Resolve app version from version.py
        # Single source of truth: the exe metadata is derived from the same
        # src/nano_offline/version.py the app shows on its splash/login screen.
        id: appver
        shell: pwsh
        run: |
          python tools/app_version.py --shell | Out-String | ForEach-Object {
            if ($_ -match 'BUILD_VERSION=(.*)') { "build_version=$($Matches[1])" >> $env:GITHUB_OUTPUT }
            if ($_ -match 'BUILD_NUMBER=(.*)') { "build_number=$($Matches[1])" >> $env:GITHUB_OUTPUT }
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          flet build windows --build-number "${{ steps.appver.outputs.build_number }}" --build-version "${{ steps.appver.outputs.build_version }}" --skip-flutter-doctor 2>&1 | Tee-Object -FilePath flet-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flet-build-log-windows
          path: flet-build.log

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-exe
          # flet stages the exe under build/windows/<arch>/runner/Release --
          # glob so a layout rename can't silently upload nothing.
          path: |
            build/windows/**/*.exe
          if-no-files-found: error
          retention-days: 14
